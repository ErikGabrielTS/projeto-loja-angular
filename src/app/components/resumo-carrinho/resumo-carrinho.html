<div class="resumo-card">
  <h2 class="resumo-titulo">Resumo do Pedido</h2>

  <div class="resumo-detalhes">
    <div class="resumo-linha">
      <span>Quantidade de itens</span>
      <span class="resumo-valor">{{ itens().length }}</span>
    </div>

    <div class="resumo-linha">
      <span>Subtotal</span>
      <span class="resumo-valor">{{ subtotal() | currency:'BRL':'symbol':'1.2-2' }}</span>
    </div>

    <div class="resumo-linha">
      <span>Frete</span>
      <span class="resumo-valor frete-gratis">Grátis</span>
    </div>

    <div class="resumo-divisor"></div>

    <div class="resumo-linha total">
      <span>Total</span>
      <span class="resumo-valor-total">{{ total() | currency:'BRL':'symbol':'1.2-2' }}</span>
    </div>
  </div>

  <!-- <button type="button" class="btn-finalizar" [disabled]="itens().length === 0" (click)="finalizarPedido()" >Finalizar Pedido</button> -->

  <!-- <button 
    class="btn-finalizar" 
    [disabled]="itens().length === 0">
    Finalizar Compra
  </button> -->

</div>
